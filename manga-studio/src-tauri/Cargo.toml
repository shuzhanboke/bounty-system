[package]
name = "manga-studio"
version = "0.1.0"
description = "AI漫剧工作室 - 一站式AI漫剧创作工具"
edition = "2021"

[lib]
name = "manga_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
